<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <rect width="800" height="1100" fill="#FFFFFF"/>
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Header Banner -->
  <path d="M 40 40 L 760 40 L 760 140 L 40 140 Z" fill="#F8FAFC"/>
  <circle cx="95" cy="90" r="35" fill="#0D47A1" opacity="0.1"/>
  <circle cx="95" cy="90" r="25" fill="#0D47A1"/>
  <text x="95" y="96" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">OFFICIAL</text>
  
  <text x="400" y="75" font-family="'Hind Siliguri', 'Segoe UI', Arial" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">প্রাণ-আরএফএল গ্রুপ - ম্যানেজমেন্ট ট্রেইনি অফিসার নিয়োগ ২০২৬</text>
  <text x="400" y="102" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">PRAN-RFL Centre, Dhaka</text>
  <text x="400" y="122" font-family="'Inter', monospace" font-size="11" fill="#6B7280" text-anchor="middle">স্মারক নম্বর: PRAN/MTO/Batch-26 | প্রকাশ: ২০২৬</text>
  
  <line x1="50" y1="150" x2="750" y2="150" stroke="#0D47A1" stroke-width="2"/>
  <line x1="50" y1="154" x2="750" y2="154" stroke="#FF9800" stroke-width="1.5"/>

  <!-- Content Representation Lines & Mock Table -->
  <g transform="translate(60, 180)">
    <text x="0" y="20" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="700" fill="#1F2937">নিয়োগ সংক্রান্ত সাধারণ নির্দেশাবলি ও সারসংক্ষেপ:</text>
    <rect x="0" y="35" width="680" height="40" fill="#F3F4F6" rx="4"/>
    <text x="20" y="60" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="700" fill="#374151">ক্রমিক</text>
    <text x="120" y="60" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="700" fill="#374151">পদের নাম ও গ্রেড</text>
    <text x="360" y="60" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="700" fill="#374151">পদসংখ্যা</text>
    <text x="500" y="60" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="700" fill="#374151">শিক্ষাগত যোগ্যতা</text>

    <!-- Table Rows -->
    <rect x="0" y="80" width="680" height="45" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="30" y="108" font-family="'Inter', sans-serif" font-size="12" fill="#4B5563">০১</text>
    <text x="120" y="108" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#111827">মূল ক্যাডার / প্রধান পদ</text>
    <text x="375" y="108" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#111827">বিজ্ঞপ্তি অনুযায়ী</text>
    <text x="500" y="108" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#111827">স্নাতক / স্নাতকোত্তর</text>

    <rect x="0" y="130" width="680" height="45" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="30" y="158" font-family="'Inter', sans-serif" font-size="12" fill="#4B5563">০২</text>
    <text x="120" y="158" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#111827">সহকারী ও কারিগরি কর্মকর্তা</text>
    <text x="375" y="158" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#111827">নির্ধারিত কোটা</text>
    <text x="500" y="158" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#111827">সংশ্লিষ্ট বিষয়ে ডিগ্রি</text>
    
    <!-- Paragraph lines -->
    <g transform="translate(0, 210)">
      <text x="0" y="15" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#1F2937">শর্তাবলি ও আবেদন প্রক্রিয়া:</text>
      <rect x="0" y="30" width="680" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="48" width="640" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="66" width="660" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="84" width="580" height="8" rx="4" fill="#E5E7EB"/>
      
      <rect x="0" y="115" width="680" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="133" width="620" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="151" width="650" height="8" rx="4" fill="#E5E7EB"/>

      <rect x="0" y="180" width="680" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="198" width="540" height="8" rx="4" fill="#E5E7EB"/>
    </g>

    <!-- Official Stamp & Signature -->
    <g transform="translate(420, 500)">
      <circle cx="100" cy="80" r="55" fill="none" stroke="#0D47A1" stroke-width="2.5" stroke-dasharray="6,4"/>
      <text x="100" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0D47A1" text-anchor="middle">VERIFIED CIRCULAR</text>
      <text x="100" y="88" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="700" fill="#0D47A1" text-anchor="middle">অনুমোদিত কপি</text>
      <text x="100" y="104" font-family="'Inter', sans-serif" font-size="9" fill="#0D47A1" text-anchor="middle">GOVT OF BANGLADESH</text>
      
      <path d="M 40 170 Q 90 140 140 165 T 200 150" fill="none" stroke="#1E3A8A" stroke-width="2.5"/>
      <text x="120" y="195" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">নিয়োগ ও পরীক্ষা নিয়ন্ত্রক</text>
      <text x="120" y="212" font-family="'Hind Siliguri', sans-serif" font-size="11" fill="#4B5563" text-anchor="middle">মানবসম্পদ ও প্রশাসন বিভাগ</text>
    </g>

    <!-- Barcode / Watermark -->
    <g transform="translate(20, 680)">
      <rect x="0" y="0" width="220" height="40" fill="#F3F4F6"/>
      <line x1="10" y1="5" x2="10" y2="35" stroke="#111827" stroke-width="2"/>
      <line x1="15" y1="5" x2="15" y2="35" stroke="#111827" stroke-width="4"/>
      <line x1="23" y1="5" x2="23" y2="35" stroke="#111827" stroke-width="1"/>
      <line x1="28" y1="5" x2="28" y2="35" stroke="#111827" stroke-width="3"/>
      <line x1="36" y1="5" x2="36" y2="35" stroke="#111827" stroke-width="5"/>
      <line x1="47" y1="5" x2="47" y2="35" stroke="#111827" stroke-width="2"/>
      <line x1="55" y1="5" x2="55" y2="35" stroke="#111827" stroke-width="4"/>
      <line x1="65" y1="5" x2="65" y2="35" stroke="#111827" stroke-width="2"/>
      <line x1="75" y1="5" x2="75" y2="35" stroke="#111827" stroke-width="3"/>
      <line x1="85" y1="5" x2="85" y2="35" stroke="#111827" stroke-width="1"/>
      <line x1="93" y1="5" x2="93" y2="35" stroke="#111827" stroke-width="5"/>
      <line x1="105" y1="5" x2="105" y2="35" stroke="#111827" stroke-width="3"/>
      <line x1="115" y1="5" x2="115" y2="35" stroke="#111827" stroke-width="2"/>
      <line x1="125" y1="5" x2="125" y2="35" stroke="#111827" stroke-width="4"/>
      <line x1="135" y1="5" x2="135" y2="35" stroke="#111827" stroke-width="2"/>
      <line x1="145" y1="5" x2="145" y2="35" stroke="#111827" stroke-width="5"/>
      <line x1="158" y1="5" x2="158" y2="35" stroke="#111827" stroke-width="1"/>
      <line x1="165" y1="5" x2="165" y2="35" stroke="#111827" stroke-width="3"/>
      <line x1="175" y1="5" x2="175" y2="35" stroke="#111827" stroke-width="2"/>
      <line x1="185" y1="5" x2="185" y2="35" stroke="#111827" stroke-width="4"/>
      <line x1="195" y1="5" x2="195" y2="35" stroke="#111827" stroke-width="3"/>
      <text x="110" y="55" font-family="'Inter', monospace" font-size="10" fill="#6B7280" text-anchor="middle">OFFICIAL AUTH CIRCULAR</text>
    </g>
  </g>
  
  <rect x="40" y="1030" width="720" height="25" fill="#F8FAFC"/>
  <text x="400" y="1047" font-family="'Hind Siliguri', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">চাকরি বার্তা পোর্টাল কর্তৃক সংরক্ষিত ও পরীক্ষিত নমুনা সার্কুলার কপি | মূল প্রজ্ঞাপনের সাথে যাচাই করে নিন</text>
</svg>
